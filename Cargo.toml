[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
a3-core = { path = "crates/a3-core" }
a3-pbo = { path = "crates/a3-pbo" }
a3-vfs = { path = "crates/a3-vfs" }
a3-audio = { path = "crates/a3-audio" }
a3-fonts = { path = "crates/a3-fonts" }
a3-audio-formats = { path = "crates/a3-audio-formats" }
a3-signing = { path = "crates/a3-signing" }
a3-rtm = { path = "crates/a3-rtm" }
a3-stringtable = { path = "crates/a3-stringtable" }
a3-sqf = { path = "crates/a3-sqf" }
a3-config = { path = "crates/a3-config" }
a3-gamedata = { path = "crates/a3-gamedata" }
a3-preproc = { path = "crates/a3-preproc" }
a3-p3d = { path = "crates/a3-p3d" }
a3-anim = { path = "crates/a3-anim" }
a3-moves = { path = "crates/a3-moves" }
a3-pose = { path = "crates/a3-pose" }
a3-compress = { path = "crates/a3-compress" }
a3-wrp = { path = "crates/a3-wrp" }
a3-paa = { path = "crates/a3-paa" }
a3-landscape = { path = "crates/a3-landscape" }
a3-world = { path = "crates/a3-world" }
a3-mission = { path = "crates/a3-mission" }
a3-environment = { path = "crates/a3-environment" }
a3-landscape-render = { path = "crates/a3-landscape-render" }
a3-render-ui = { path = "crates/a3-render-ui" }
a3-ui = { path = "crates/a3-ui" }
a3-physics = { path = "crates/a3-physics" }
a3-vehicles = { path = "crates/a3-vehicles" }
a3-nav = { path = "crates/a3-nav" }

# Physics (ADR 0001, ADR 0008)
rapier3d-f64 = "0.36"

# Errors
thiserror = "2"
anyhow = "1"

# Math and binary data
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
byteorder = "1"
bytes = "1.10"

# Images and textures
texpresso = "2"

# Files and hashing
memmap2 = "0.9"
sha1 = "0.10"
tempfile = "3"

# Compression
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

# Logging and tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Images (png is listed with the engine core)
tiff = "0.9"
# Audio
lewton = "0.10"
hound = "3.5"

# a3-signing
num-bigint = "0.4"
# a3-stringtable
roxmltree = "0.21"

# a3-audio
cpal = "0.16"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Collections
indexmap = "2"
smallvec = { version = "1", features = ["union"] }
rustc-hash = "2"

# Text
fancy-regex = "0.14"

# Benchmarks
criterion = { version = "0.5", default-features = false }

# Engine core: window, input, rendering
a3-input = { path = "crates/a3-input" }
a3-platform = { path = "crates/a3-platform" }
a3-render = { path = "crates/a3-render" }
a3-render-models = { path = "crates/a3-render-models" }
winit = "0.30"
gilrs = "0.11"
wgpu = "30"
pollster = "0.4"
png = "0.18"

# Testing
proptest = "1"
lzokay-native = { version = "0.1", default-features = false, features = ["compress"] }
insta = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hashing whole archives in tests is far too slow unoptimised.
[profile.dev.package.sha1]
opt-level = 3

# Terrain and codec real-data tests decode hundreds of MiB.
[profile.dev.package.a3-compress]
opt-level = 3

[profile.dev.package.a3-wrp]
opt-level = 3

[profile.dev.package.a3-p3d]
opt-level = 3

# Building a Landscape decodes thousands of layer materials and satellite tiles.
[profile.dev.package.a3-landscape-render]
opt-level = 3

[profile.dev.package.a3-paa]
opt-level = 3

[profile.dev.package.a3-config]
opt-level = 3

[profile.dev.package.lzokay-native]
opt-level = 3

# Collision building and queries over real terrains.
[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.rapier3d-f64]
opt-level = 3

[profile.dev.package.a3-physics]
opt-level = 3

# Baking the grid of a real terrain and planning many paths in the nav tests.
[profile.dev.package.a3-nav]
opt-level = 3

# Each git worktree has its own target/. Keep it small: line tables keep backtraces readable,
# dependencies carry no debuginfo. The package overrides above only set opt-level, so they
# inherit these settings.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
