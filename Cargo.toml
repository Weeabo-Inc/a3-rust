[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
a3-core = { path = "crates/a3-core" }
a3-pbo = { path = "crates/a3-pbo" }
a3-vfs = { path = "crates/a3-vfs" }
a3-sqf = { path = "crates/a3-sqf" }
a3-config = { path = "crates/a3-config" }
a3-gamedata = { path = "crates/a3-gamedata" }
a3-preproc = { path = "crates/a3-preproc" }
a3-p3d = { path = "crates/a3-p3d" }
a3-compress = { path = "crates/a3-compress" }
a3-wrp = { path = "crates/a3-wrp" }

# Errors
thiserror = "2"
anyhow = "1"

# Math and binary data
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
byteorder = "1"
bytes = "1.10"

# Files and hashing
memmap2 = "0.9"
sha1 = "0.10"
tempfile = "3"

# Compression
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "safe-encode"] }

# Logging and tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Collections
indexmap = "2"

# Engine core: window, input, rendering
a3-input = { path = "crates/a3-input" }
a3-platform = { path = "crates/a3-platform" }
a3-render = { path = "crates/a3-render" }
winit = "0.30"
gilrs = "0.11"
wgpu = "30"
pollster = "0.4"
png = "0.18"

# Testing
proptest = "1"
lzokay-native = { version = "0.1", default-features = false, features = ["compress"] }
insta = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hashing whole archives in tests is far too slow unoptimised.
[profile.dev.package.sha1]
opt-level = 3
